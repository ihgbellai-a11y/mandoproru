<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>教え — Oshie · Mando Pro</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="教え">
  <meta name="theme-color" content="#08080a">
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%23080808'/><text x='90' y='130' font-family='serif' font-size='110' font-weight='300' fill='%23d4af37' text-anchor='middle'>教</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #08080a;
      --bg-2: #0d0d10;
      --bg-3: #14141a;
      --gold: #d4af37;
      --gold-soft: #e8c870;
      --gold-deep: #8b6914;
      --bone: #f5f5f0;
      --bone-soft: #b5b5a8;
      --crimson: #6b0a0a;
      --teal: #5eead4;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body, body * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    input, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    html, body {
      background: var(--bg);
      color: var(--bone);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(212,175,55,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(107,10,10,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    .watermark {
      position: fixed; right: -20px; top: 50%;
      transform: translateY(-50%);
      font-family: 'Noto Serif JP', serif;
      font-size: 14rem; font-weight: 200;
      color: rgba(212,175,55,0.025);
      writing-mode: vertical-rl;
      letter-spacing: -10px;
      pointer-events: none; z-index: 0; user-select: none;
    }

    .container {
      position: relative; z-index: 10;
      max-width: 480px; margin: 0 auto;
      padding: 50px 22px 40px;
    }

    .float-controls {
      position: fixed;
      top: 18px; right: 18px;
      display: flex; gap: 10px;
      z-index: 100;
    }
    .ctrl-btn {
      width: 38px; height: 38px;
      background: rgba(20,20,26,0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 50%;
      color: var(--gold-deep);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:active, .ctrl-btn.active {
      background: rgba(212,175,55,0.15);
      color: var(--gold);
      border-color: var(--gold);
    }
    .ctrl-btn.synced { color: var(--teal); border-color: rgba(94,234,212,0.4); }

    /* HEADER */
    header { text-align: center; margin-bottom: 28px; animation: fadeInDown 1s ease; }
    .kanji-main {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: 3.2rem;
      color: var(--gold);
      letter-spacing: 14px;
      padding-left: 14px;
      margin-bottom: 14px;
      text-shadow: 0 0 40px rgba(212,175,55,0.35);
      line-height: 1;
    }
    .romaji {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--gold-deep);
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.65rem;
      color: var(--gold-deep);
      letter-spacing: 4px;
      margin-top: 8px;
      text-transform: uppercase;
    }
    .header-line {
      width: 1px; height: 40px;
      background: linear-gradient(180deg, transparent, var(--gold), transparent);
      margin: 24px auto;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
      animation: fadeInUp 1s ease 0.2s both;
    }
    .stat {
      background: linear-gradient(145deg, var(--bg-3), var(--bg-2));
      border: 1px solid rgba(212,175,55,0.15);
      border-radius: 6px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: var(--gold);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.55rem;
      color: var(--gold-deep);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .stat-fav {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.75rem;
      color: var(--bone);
      margin-top: 4px;
    }

    /* STATUS BANNER */
    .status-banner {
      background: linear-gradient(145deg, var(--bg-3), var(--bg-2));
      border: 1px solid rgba(212,175,55,0.18);
      border-radius: 6px;
      padding: 12px 18px;
      margin-bottom: 22px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--bone-soft);
      letter-spacing: 2px;
      transition: all 0.4s;
      animation: fadeInUp 1s ease 0.3s both;
    }
    .status-banner.success { border-color: var(--teal); color: var(--teal); }
    .status-banner.error { border-color: var(--crimson); color: #ff8888; }
    .status-banner .label {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.55rem;
      color: var(--gold-deep);
      letter-spacing: 3px;
      display: block;
      margin-bottom: 3px;
    }

    /* TABS */
    .sort-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: var(--bg-2);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid rgba(212,175,55,0.1);
    }
    .sort-tab {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      color: var(--bone-soft);
      font-family: inherit;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .sort-tab.active {
      background: rgba(212,175,55,0.15);
      color: var(--gold);
    }

    /* SECTION LABEL */
    .section-label {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 5px;
      color: var(--gold-deep);
      text-align: center;
      margin: 24px 0 14px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .section-label::before, .section-label::after {
      content: '';
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
    }

    .commands { display: flex; flex-direction: column; gap: 10px; }

    .cmd {
      background: linear-gradient(145deg, var(--bg-3), var(--bg-2));
      border: 1px solid rgba(212,175,55,0.15);
      border-radius: 6px;
      padding: 14px 16px;
      transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      align-items: center;
      gap: 12px;
      animation: fadeInUp 0.5s ease both;
    }
    .cmd::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.08), transparent);
      transition: left 0.7s;
      pointer-events: none;
    }
    .cmd:active { transform: scale(0.98); }
    .cmd.sending { border-color: var(--gold); }
    .cmd.sending::before { left: 100%; }
    .cmd.top-fav {
      border-color: rgba(212,175,55,0.4);
      background: linear-gradient(145deg, rgba(212,175,55,0.04), var(--bg-2));
    }

    .cmd-kanji {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.4rem;
      color: var(--gold);
      line-height: 1;
      min-width: 28px;
      text-align: center;
    }
    .cmd-content { text-align: left; cursor: pointer; min-width: 0; }
    .cmd-name {
      font-size: 0.78rem;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--bone);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cmd-medal {
      font-size: 0.85rem;
      line-height: 1;
    }
    .cmd-msg {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.72rem;
      color: var(--bone-soft);
      margin-top: 3px;
      opacity: 0.8;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Contador de envíos */
    .cmd-count {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      padding: 4px 6px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      border: 1px solid rgba(212,175,55,0.1);
    }
    .cmd-count-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--gold);
      line-height: 1;
      font-weight: 400;
    }
    .cmd-count-label {
      font-size: 0.5rem;
      color: var(--gold-deep);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .cmd.top-fav .cmd-count {
      background: rgba(212,175,55,0.1);
      border-color: var(--gold);
    }
    .cmd.top-fav .cmd-count-num { color: var(--gold-soft); }

    .cmd-send {
      background: transparent;
      border: 1px solid rgba(212,175,55,0.4);
      color: var(--gold);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cmd-send:active {
      background: var(--gold);
      color: var(--bg);
      transform: scale(0.92);
    }
    .cmd-delete {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.25);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.3s;
    }
    .cmd-delete:active {
      border-color: var(--crimson);
      color: #ff8888;
    }
    .cmd.preset .cmd-delete { display: none; }
    .cmd.preset { grid-template-columns: auto 1fr auto auto; }

    /* CREATOR */
    .creator {
      background: linear-gradient(145deg, var(--bg-3), var(--bg-2));
      border: 1px dashed rgba(212,175,55,0.25);
      border-radius: 8px;
      padding: 22px 20px;
      margin-top: 14px;
      animation: fadeInUp 0.6s ease 0.4s both;
    }
    .creator-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.7rem;
      color: var(--gold);
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    .creator input, .creator textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      color: var(--bone);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-bottom: 10px;
      -webkit-user-select: text;
      user-select: text;
      resize: vertical;
    }
    .creator input:focus, .creator textarea:focus { outline: none; border-color: var(--gold); }

    .kanji-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      justify-content: center;
    }
    .kanji-pick {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      width: 38px;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Noto Serif JP', serif;
      font-size: 1.1rem;
      color: var(--bone-soft);
      transition: all 0.2s;
    }
    .kanji-pick.selected {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(212,175,55,0.1);
    }

    .btn-add {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-add:active { background: var(--gold-soft); }

    /* FOOTER */
    footer {
      text-align: center;
      margin-top: 50px;
      padding-top: 30px;
    }
    .ornament {
      width: 100px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 24px;
    }
    .footer-text {
      font-size: 0.6rem;
      color: var(--gold-deep);
      letter-spacing: 4px;
      line-height: 2;
      text-transform: uppercase;
    }
    .footer-jp {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: 0.7rem;
      color: var(--gold);
      letter-spacing: 4px;
      margin-top: 8px;
    }
    .reset-counters-btn {
      margin-top: 14px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--bone-soft);
      padding: 8px 18px;
      border-radius: 4px;
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    .reset-counters-btn:active { border-color: var(--crimson); color: #ff8888; }

    /* MODAL CONFIRMACIÓN */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(5,5,8,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; animation: fadeIn 0.3s; }
    .modal {
      background: linear-gradient(145deg, var(--bg-3), var(--bg-2));
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 30px 26px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: scaleIn 0.4s cubic-bezier(0.23,1,0.32,1);
    }
    .modal-kanji {
      font-family: 'Noto Serif JP', serif;
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.75rem;
      color: var(--gold-deep);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .modal-msg {
      font-size: 0.9rem;
      color: var(--bone);
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      border: 1px solid rgba(212,175,55,0.1);
    }
    .modal-actions { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 4px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary { background: var(--gold); color: var(--bg); }
    .btn-secondary { background: rgba(255,255,255,0.05); color: var(--bone-soft); border: 1px solid rgba(255,255,255,0.08); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(145deg, var(--bg-3), var(--bg-2));
      border: 1px solid var(--teal);
      border-radius: 6px;
      padding: 12px 22px;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: var(--teal);
      z-index: 300;
      transition: transform 0.4s cubic-bezier(0.23,1,0.32,1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--crimson); color: #ff8888; }

    @keyframes fadeInDown { from { opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
    @keyframes fadeIn { from { opacity:0;} to {opacity:1;} }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.95);} to {opacity:1; transform:scale(1);} }
    @keyframes pulseCount { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); color: var(--teal); } }
    .pulsing { animation: pulseCount 0.5s ease; }

    @media (max-width: 480px) {
      .kanji-main { font-size: 2.6rem; letter-spacing: 10px; }
      .cmd { padding: 12px 12px; gap: 8px; }
      .cmd-kanji { font-size: 1.2rem; min-width: 24px; }
      .watermark { font-size: 10rem; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

<canvas class="particles" id="particles"></canvas>
<div class="watermark">教</div>

<div class="float-controls">
  <a href="https://ihgbellai-a11y.github.io/yesru1314/" class="ctrl-btn" title="Volver al inicio" style="text-decoration:none">←</a>
</div>

<div class="container">
  <header>
    <h1 class="kanji-main">教え</h1>
    <p class="romaji">Oshie</p>
    <p class="subtitle">Mando de voluntad directa</p>
    <div class="header-line"></div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Órdenes enviadas</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statFavKanji" style="font-family:Noto Serif JP,serif">—</div>
      <div class="stat-fav" id="statFavName">Sin favorita aún</div>
    </div>
  </div>

  <div class="status-banner" id="statusBanner">
    <span class="label">状態 · Estado</span>
    <span id="statusText">Sincronizado · listo para dictar</span>
  </div>

  <div class="sort-tabs">
    <button class="sort-tab active" data-sort="default">Orden original</button>
    <button class="sort-tab" data-sort="popular">Más enviadas</button>
  </div>

  <div class="section-label">命令 · Órdenes rápidas</div>
  <div class="commands" id="presetCommands"></div>

  <div class="section-label">私 · Personalizadas</div>
  <div class="commands" id="customCommands"></div>

  <div class="creator">
    <div class="creator-title">+ Dictar nueva orden</div>
    <input type="text" id="newName" placeholder="Nombre corto (ej: silencio)" maxlength="40" autocomplete="off">
    <textarea id="newMsg" placeholder="Mensaje completo que se enviará..." rows="2" maxlength="300"></textarea>
    <div class="kanji-picker" id="kanjiPicker"></div>
    <button class="btn-add" id="btnAdd">Añadir al panel</button>
  </div>

  <footer>
    <div class="ornament"></div>
    <div class="footer-text">Tu voluntad es mi única ley</div>
    <div class="footer-jp">永遠にあなたのもの</div>
    <button class="reset-counters-btn" id="btnResetCounters">Reiniciar contadores</button>
  </footer>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-kanji" id="modalKanji">命</div>
    <div class="modal-title">Confirmar envío</div>
    <div class="modal-msg" id="modalMsg">—</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
      <button class="btn btn-primary" id="btnConfirm">Enviar orden</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">—</div>

<script>
/* === PROTECCIONES === */
document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
document.addEventListener('keydown', e => {
  if (e.key === 'F12') { e.preventDefault(); return false; }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && /^[IiJjCc]$/.test(e.key)) { e.preventDefault(); return false; }
  if ((e.ctrlKey || e.metaKey) && /^[UuSs]$/.test(e.key)) { e.preventDefault(); return false; }
});
document.addEventListener('dragstart', e => e.preventDefault());

/* === CONFIG TELEGRAM === */
const TOKEN = "7723798586:AAGKk9rfpvNNpidJFrKUJxgAZy3zzQWZUyE";
const CHAT_ID = "8330859369";

/* === ÓRDENES PRESET (con id estable) === */
const presetCommands = [
  { id: 'preset-dogeza', kanji: '跪', name: 'Dogeza Total', msg: '🧎 ¡DOGEZA TOTAL! Al suelo, ahora mismo.' },
  { id: 'preset-silencio', kanji: '黙', name: 'Anulación de voz', msg: '🤫 VOTO DE SILENCIO ABSOLUTO. No hables hasta que yo te toque.' },
  { id: 'preset-finanzas', kanji: '財', name: 'Rendición económica', msg: '💰 RITUAL DE FINANZAS: Trae los tickets y rinde cuentas de rodillas.' },
  { id: 'preset-cuerpo', kanji: '鎖', name: 'Cierre de cuerpo', msg: '🔒 PLACER BLOQUEADO. Tu cuerpo es mío, tu éxtasis me pertenece.' },
  { id: 'preset-campanas', kanji: '鐘', name: 'Campanas', msg: '🔔 CAMPANAS: Ven a mi presencia de inmediato. Deja todo.' }
];

const availableKanji = ['命','心','支','奉','服','跪','黙','鎖','鐘','財','身','美','静','光','花','月','水','火','風','道'];

/* === ESTADO === */
let customCommands = JSON.parse(localStorage.getItem('oshie_custom') || '[]');
let counters = JSON.parse(localStorage.getItem('oshie_counters') || '{}');
let currentSort = 'default';
let selectedKanji = '命';
let pendingCommand = null;

/* === SHEETS SYNC === */
const SHEET_URL_KEY = 'oshie_sheetUrl';
const DEVICE_KEY = 'oshie_device';
const QUEUE_KEY = 'oshie_queue';
const DEFAULT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxKSQtv3WbbimTcQQFX5y8UZWrgmcDxzOufrC3smj2bGcYJjUUI7u5uwUZPrMzc2xQp/exec';
let sheetUrl = localStorage.getItem(SHEET_URL_KEY) || DEFAULT_SHEET_URL;
let deviceName = localStorage.getItem(DEVICE_KEY) || 'dispositivo';
let pendingQueue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
let syncing = false;
if (!localStorage.getItem(SHEET_URL_KEY)) localStorage.setItem(SHEET_URL_KEY, DEFAULT_SHEET_URL);

/* Migración: si los customs no tienen id, asignárselo */
let needsMigration = false;
customCommands.forEach((c, i) => {
  if (!c.id) { c.id = 'custom-' + Date.now() + '-' + i; needsMigration = true; }
});
if (needsMigration) localStorage.setItem('oshie_custom', JSON.stringify(customCommands));

/* === DOM === */
const $presetContainer = document.getElementById('presetCommands');
const $customContainer = document.getElementById('customCommands');
const $statusBanner = document.getElementById('statusBanner');
const $statusText = document.getElementById('statusText');
const $modal = document.getElementById('confirmModal');
const $modalKanji = document.getElementById('modalKanji');
const $modalMsg = document.getElementById('modalMsg');
const $toast = document.getElementById('toast');

/* === HELPERS === */
function getCount(id) { return counters[id] || 0; }
function totalSent() { return Object.values(counters).reduce((a,b) => a+b, 0); }
function getFavorite() {
  let fav = null, max = 0;
  const all = [...presetCommands, ...customCommands];
  all.forEach(c => {
    const n = getCount(c.id);
    if (n > max) { max = n; fav = c; }
  });
  return { cmd: fav, count: max };
}
function getRank(id) {
  // Devuelve la posición en el ranking (1 = más enviada)
  const all = [...presetCommands, ...customCommands]
    .map(c => ({ id: c.id, count: getCount(c.id) }))
    .filter(c => c.count > 0)
    .sort((a,b) => b.count - a.count);
  const idx = all.findIndex(c => c.id === id);
  return idx === -1 ? null : idx + 1;
}

/* === STATS HEADER === */
function updateStats() {
  document.getElementById('statTotal').textContent = totalSent();
  const fav = getFavorite();
  if (fav.cmd) {
    document.getElementById('statFavKanji').textContent = fav.cmd.kanji;
    document.getElementById('statFavName').textContent = `${fav.cmd.name} · ${fav.count}`;
  } else {
    document.getElementById('statFavKanji').textContent = '—';
    document.getElementById('statFavName').textContent = 'Sin favorita aún';
  }
}

/* === RENDER === */
function buildCard(cmd, isPreset) {
  const count = getCount(cmd.id);
  const rank = getRank(cmd.id);
  const isTopFav = rank === 1 && count > 0;

  const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';

  const el = document.createElement('div');
  el.className = 'cmd' + (isPreset ? ' preset' : '') + (isTopFav ? ' top-fav' : '');
  el.dataset.cmdId = cmd.id;

  const deleteBtn = isPreset ? '' : '<button class="cmd-delete" title="Eliminar">✕</button>';

  el.innerHTML = `
    <div class="cmd-kanji">${cmd.kanji}</div>
    <div class="cmd-content">
      <div class="cmd-name">${medal ? `<span class="cmd-medal">${medal}</span>` : ''}${cmd.name}</div>
      <div class="cmd-msg">« ${cmd.msg} »</div>
    </div>
    <div class="cmd-count">
      <div class="cmd-count-num" data-count="${cmd.id}">${count}</div>
      <div class="cmd-count-label">envíos</div>
    </div>
    <button class="cmd-send" title="Enviar">↗</button>
    ${deleteBtn}
  `;
  el.querySelector('.cmd-send').addEventListener('click', () => askConfirm(cmd, el));
  el.querySelector('.cmd-content').addEventListener('click', () => askConfirm(cmd, el));
  if (!isPreset) {
    el.querySelector('.cmd-delete').addEventListener('click', () => deleteCustom(cmd.id));
  }
  return el;
}

function getSortedList(list) {
  if (currentSort === 'popular') {
    return [...list].sort((a, b) => getCount(b.id) - getCount(a.id));
  }
  return list;
}

function renderAll() {
  $presetContainer.innerHTML = '';
  const sortedPreset = getSortedList(presetCommands);
  sortedPreset.forEach((cmd, i) => {
    const el = buildCard(cmd, true);
    el.style.animationDelay = (i * 0.05) + 's';
    $presetContainer.appendChild(el);
  });

  $customContainer.innerHTML = '';
  if (customCommands.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center; color:var(--bone-soft); opacity:0.5; font-style:italic; font-family:Cormorant Garamond,serif; font-size:0.85rem; padding:14px;';
    empty.textContent = '— Sin órdenes personalizadas —';
    $customContainer.appendChild(empty);
  } else {
    const sortedCustom = getSortedList(customCommands);
    sortedCustom.forEach((cmd, i) => {
      const el = buildCard(cmd, false);
      el.style.animationDelay = (i * 0.05) + 's';
      $customContainer.appendChild(el);
    });
  }
  updateStats();
}

/* === KANJI PICKER === */
function buildKanjiPicker() {
  const picker = document.getElementById('kanjiPicker');
  picker.innerHTML = '';
  availableKanji.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'kanji-pick' + (k === selectedKanji ? ' selected' : '');
    btn.textContent = k;
    btn.addEventListener('click', () => {
      selectedKanji = k;
      buildKanjiPicker();
    });
    picker.appendChild(btn);
  });
}

/* === ADD CUSTOM === */
document.getElementById('btnAdd').addEventListener('click', () => {
  const name = document.getElementById('newName').value.trim();
  const msg = document.getElementById('newMsg').value.trim();
  if (!name || !msg) {
    setStatus('Falta nombre o mensaje', 'error');
    return;
  }
  const id = 'custom-' + Date.now();
  customCommands.push({ id, kanji: selectedKanji, name, msg });
  localStorage.setItem('oshie_custom', JSON.stringify(customCommands));
  document.getElementById('newName').value = '';
  document.getElementById('newMsg').value = '';
  selectedKanji = '命';
  buildKanjiPicker();
  renderAll();
  showToast('Orden añadida al panel');
});

function deleteCustom(id) {
  customCommands = customCommands.filter(c => c.id !== id);
  localStorage.setItem('oshie_custom', JSON.stringify(customCommands));
  // Mantener el contador por si la vuelve a crear con mismo nombre? Mejor borrarlo.
  delete counters[id];
  localStorage.setItem('oshie_counters', JSON.stringify(counters));
  renderAll();
  showToast('Orden eliminada');
}

/* === CONFIRMAR ENVÍO === */
function askConfirm(cmd, el) {
  pendingCommand = { cmd, el };
  $modalKanji.textContent = cmd.kanji;
  $modalMsg.textContent = cmd.msg;
  $modal.classList.add('show');
}

document.getElementById('btnCancel').addEventListener('click', () => {
  $modal.classList.remove('show');
  pendingCommand = null;
});

document.getElementById('btnConfirm').addEventListener('click', async () => {
  if (!pendingCommand) return;
  const { cmd, el } = pendingCommand;
  $modal.classList.remove('show');
  el.classList.add('sending');
  setStatus('Enviando...', '');

  try {
    const url = `https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(cmd.msg)}`;
    const res = await fetch(url);
    if (res.ok) {
      // INCREMENTAR CONTADOR
      counters[cmd.id] = (counters[cmd.id] || 0) + 1;
      localStorage.setItem('oshie_counters', JSON.stringify(counters));

      // Actualizar contador con animación, si todavía está visible
      const countEl = el.querySelector(`[data-count="${cmd.id}"]`);
      if (countEl) {
        countEl.textContent = counters[cmd.id];
        countEl.classList.remove('pulsing');
        void countEl.offsetWidth;
        countEl.classList.add('pulsing');
      }

      setStatus('Orden enviada · ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}), 'success');
      showToast(`« ${cmd.name} » · enviada ${counters[cmd.id]} veces`);

      // Sincronizar con Sheets
      if (sheetUrl) {
        queueAction({
          tipo: 'oshie',
          ordenId: cmd.id,
          kanji: cmd.kanji,
          nombre: cmd.name,
          mensaje: cmd.msg,
          dispositivo: deviceName
        });
        flushQueue();
      }

      // Re-render para refrescar ranking, medallas y stats (con un pequeño delay para ver la animación)
      setTimeout(() => renderAll(), 600);
    } else {
      throw new Error('Telegram error');
    }
  } catch (e) {
    setStatus('Error de envío · revisa la conexión', 'error');
    showToast('Error de envío', 'error');
  } finally {
    setTimeout(() => el.classList.remove('sending'), 600);
    pendingCommand = null;
  }
});

/* === SORT TABS === */
document.querySelectorAll('.sort-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentSort = tab.dataset.sort;
    renderAll();
  });
});

/* === RESET CONTADORES === */
document.getElementById('btnResetCounters').addEventListener('click', () => {
  if (!confirm('¿Reiniciar todos los contadores de envío a cero? Esto no borra las órdenes.')) return;
  counters = {};
  localStorage.setItem('oshie_counters', JSON.stringify(counters));
  renderAll();
  showToast('Contadores reiniciados');
});

/* === STATUS === */
function setStatus(text, type) {
  $statusText.textContent = text;
  $statusBanner.className = 'status-banner' + (type ? ' ' + type : '');
  if (type) {
    setTimeout(() => {
      $statusBanner.className = 'status-banner';
      $statusText.textContent = 'Sincronizado · listo para dictar';
    }, 5000);
  }
}

/* === TOAST === */
let toastTimeout;
function showToast(text, type) {
  $toast.textContent = text;
  $toast.className = 'toast' + (type === 'error' ? ' error' : '');
  $toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => $toast.classList.remove('show'), 3000);
}

/* === PARTÍCULAS === */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
function createParticles() {
  particles = [];
  const count = innerWidth < 600 ? 18 : 32;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.3,
      vy: Math.random() * 0.3 + 0.08,
      vx: (Math.random() - 0.5) * 0.1,
      opacity: Math.random() * 0.5 + 0.1
    });
  }
}
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(212,175,55,${p.opacity})`;
    ctx.fill();
    p.y += p.vy; p.x += p.vx;
    if (p.y > canvas.height + 10) { p.y = -10; p.x = Math.random() * canvas.width; }
  });
  requestAnimationFrame(animate);
}
resizeCanvas(); createParticles(); animate();
window.addEventListener('resize', () => { resizeCanvas(); createParticles(); });

/* INIT */
renderAll();
buildKanjiPicker();

/* === SHEETS SYNC === */

function updateSyncUI() {
  // sin botón visible, no hacemos nada
}

async function fetchRemoteCounters() {
  if (!sheetUrl) return;
  try {
    const res = await fetch(sheetUrl + '?tipo=oshie', { method: 'GET' });
    const data = await res.json();
    if (!data.ok) { showToast('Error de conexión', 'error'); return; }
    // Fusionar contadores remotos con locales (gana el mayor)
    const remoteCounters = data.counters || {};
    Object.keys(remoteCounters).forEach(id => {
      const remoteCount = remoteCounters[id].count || 0;
      const localCount = counters[id] || 0;
      counters[id] = Math.max(remoteCount, localCount);
    });
    localStorage.setItem('oshie_counters', JSON.stringify(counters));
    renderAll();
    updateSyncUI();
    showToast('Sincronizado');
  } catch (err) {
    showToast('Error de conexión', 'error');
  }
}

async function sendToSheet(payload) {
  if (!sheetUrl) return false;
  try {
    const res = await fetch(sheetUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    });
    const data = await res.json();
    return data.ok === true;
  } catch (e) {
    return false;
  }
}

function queueAction(payload) {
  pendingQueue.push({ ...payload, ts: Date.now() });
  localStorage.setItem(QUEUE_KEY, JSON.stringify(pendingQueue));
}

async function flushQueue() {
  if (syncing || !sheetUrl || pendingQueue.length === 0) return;
  syncing = true;
  while (pendingQueue.length > 0) {
    const item = pendingQueue[0];
    const ok = await sendToSheet(item);
    if (ok) {
      pendingQueue.shift();
      localStorage.setItem(QUEUE_KEY, JSON.stringify(pendingQueue));
    } else {
      syncing = false;
      return;
    }
  }
  syncing = false;
}

window.addEventListener('online', flushQueue);
updateSyncUI();
if (sheetUrl) { fetchRemoteCounters(); flushQueue(); }
</script>
